# Tooling configuration for the silk repository (Weave agent plugin).
# The repo root IS the `silk` package: Weave embeds this repo directly as
# a git submodule at weave/plugins/silk.
# Run in place — no build system; this file only configures dev tools.
# Install them with:  pip install ruff mypy
#
# - ruff: picked up automatically by `ruff check`.
# - mypy: scoped to the Qt-free runtime so the output is actionable;
#   widen `files` as more modules gain types.

# Runtime dependencies (G5). The repo still runs in place as a Weave
# submodule -- there is no build backend and `pip install .` is not the
# supported path -- but what Silk needs at runtime, and at which floor, is
# now written down rather than discoverable only by importing and failing.
# Spec D66 forced this: `macrame-db` is Silk's first *binary* dependency,
# and "install the extra" is not actionable advice without a name and a
# version.
[project]
name = "silk"
version = "0.1.0"
description = "Local-first agentic runtime as Weave nodes."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",       # the node layer; functions/ is importable without it
    "pydantic>=2.7",      # tool arg models, file grants, hook configs
]

[project.optional-dependencies]
# Local inference. The pool's HTTP client speaks to llama.cpp's server, so
# the server extra is the floor for that path, not a nicety.
inference = ["llama-cpp-python[server]>=0.3.0"]
# Rendering: plan/chat markdown with emoji shortcodes. Absent, the built-in
# markdown converter is used and the display degrades in looks only.
render = ["mordant>=0.2"]
# MCP servers as node-owned sessions (D19-D22).
mcp = ["mcp>=1.2"]
# The bitemporal ledger backend (§17, D62-D66). Optional by design: absent,
# SqliteTaskStore stays the task store and history stays in the node.
ledger = ["macrame-db>=0.9"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__pycache__", "*.bak"]

[tool.ruff.lint]
# Same rule set as the Weave repo: F (pyflakes), E9 (runtime errors),
# W (whitespace/style, auto-fixable), B (bugbear — likely-bug patterns).
select = ["F", "E9", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Silk capability/toolset lifecycle methods are optional hooks by design
# (ported from silk-playground), not forgotten abstract methods.
"functions/capabilities.py" = ["B027"]
"functions/toolset.py" = ["B027"]

[tool.mypy]
python_version = "3.12"
# Pydantic's plugin, because without it every `Field(None, ...)` default
# reads as a *required* argument and a model built the ordinary way is
# 136 false "missing named argument" errors -- enough noise to hide the
# real findings underneath it (G9).
plugins = ["pydantic.mypy"]
# Scoped adoption: only the modules in `files` report; imports of the
# not-yet-typed rest (and of the Weave framework) are followed silently.
follow_imports = "silent"
# `nodes` joined `functions` on 2026-09-03 (G9). The Qt layer was left out
# originally because the noise floor was 313 errors -- 273 of them one
# missing declaration, not 273 findings. With `_widget_core` declared as
# the concrete `WidgetCore` each node is handed, what was left was small
# and real: two `_cleanup_after_worker` overrides that dropped the base's
# `skip_results` keyword, a Task Hub rescan calling a slot its base class
# does not have, and graph authoring writing a title attribute the canvas
# never reads.
files = ["functions", "nodes"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.weave_lint]
# Domain-specific lint config (python -m weave_lint [node|widget]).
# mode = "relaxed"
# ignore = []

[tool.weave_widget_lint]
# mode = "relaxed"
