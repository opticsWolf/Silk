# Silk CI.
#
# Ruff only. The runtime test suite needs the Weave framework — `import
# weave` (weave.logger in functions/, weave._discovery in silk/__init__
# with the D83 contract check at import) — and Weave is a private repo,
# so this workflow cannot fetch it: GITHUB_TOKEN is scoped to this repo
# and an anonymous clone 404s. The suite therefore runs in Weave's CI,
# where the submodule is checked out at the pinned commit and the
# framework, its dependencies and Qt's runtime libraries are already
# installed. Keep this job lint-only and let Weave's `pytest` steps own
# the tests; revisit if Weave ever publishes.

name: checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.7" "pydantic>=2.7" ruff

      - name: ruff
        run: ruff check .
