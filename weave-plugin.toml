# Silk as a Weave plugin set (weave-plugin 1.1, Weave manifest P2 and D1).
#
# Weave reads this file to load Silk: it checks the Weave range, asks the
# project once for the capabilities below, imports the `silk` package as
# `weave.plugins.silk`, lints every node's declaration and registers the
# nodes in the `weave/silk` namespace. The publisher `weave` marks Silk as
# first-party: Weave accepts it only from its first-party roots (its own
# plugins folder, or a checkout named in WEAVE_FIRST_PARTY_ROOTS). Silk's
# nodes carry live objects (model handles, toolboxes), so they stay on the
# in-process Python provider.
format = "weave-plugin 1.1"

[plugin]
publisher = "weave"
id = "silk"
version = "0.1.0"
weave = ">=0.1, <0.2"
name = "Silk"
description = "Local-first agentic runtime as Weave nodes."
license = "LGPL-3.0-only"

[capabilities]
# Model endpoints and MCP servers are whatever the user configures.
net = ["*"]
# Named credentials (D22), from ~/.weave/silk/secrets.json or the keyring.
secrets = ["*"]
# Silk's own data, and the sandboxed workspace its file tools grant (D71).
fs = ["$HOME/.weave/silk", "$PROJECT"]
# A llama.cpp server, MCP servers over stdio, toolchains in the sandbox.
subprocess = true
threads = true
# The harness drives Weave through the control API (P3).
control-api = true

[[component]]
id = "silk.nodes"
provider = "python"
module = "silk"
contract = "weave-node 1.0"
nodes = [
    "AgentInferenceSettingsNode", "ChatDisplayNode", "GGUFLNode", "PoolMonitorNode",
    "SilkAgentNode", "SilkClassifierNode", "SilkHookMonitorNode", "SilkMCPAggregatorNode",
    "SilkMCPServerNode", "SilkModelEndpointNode", "SilkModelFallbackNode",
    "SilkOrchestratorNode", "SilkPlanViewerNode", "SilkRoleNode", "SilkTaskHubNode",
    "SilkTaskNode", "SilkToolBoxNode", "SilkToolSetNode", "SilkWorkerNode", "ToolchainNode",
]
